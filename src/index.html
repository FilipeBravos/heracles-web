<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Herácles — Gestão de Unidade</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#161a1f">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!--
    As fontes (Barlow e Material Symbols) sao empacotadas pelo build, via
    angular.json. Nao ha link para o Google Fonts: o app funciona offline e
    em rede corporativa que bloqueie CDN externo, onde antes os icones
    apareciam como texto solto.
  -->
  <script>
    // Aplica o tema salvo antes do primeiro paint. Sem isto, a pagina
    // sempre abriria clara e só escureceria depois que o Angular
    // inicializasse o TemaService — um flash claro->escuro visivel a
    // cada carregamento para quem escolheu o modo escuro.
    (function () {
      try {
        var tema = localStorage.getItem('heracles.tema');
        document.documentElement.style.colorScheme =
          tema === 'escuro' ? 'dark' : tema === 'sistema' ? 'light dark' : 'light';
      } catch (e) {
        // Storage bloqueado (navegacao privada): fica no claro padrao.
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
