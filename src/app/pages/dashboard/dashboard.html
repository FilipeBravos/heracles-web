@switch (perfilUsuario()) {
  
  @case ('ALUNO') {
    <app-dashboard-aluno></app-dashboard-aluno>
  }

  @case ('PROFESSOR') {
    <app-dashboard-professor></app-dashboard-professor>
  }

  @default {
    <div class="flex flex-col items-center justify-center min-h-[400px] text-gray-400">
      <p class="text-lg italic">Verificando suas permissões de acesso...</p>
      <p class="text-xs text-gray-500 mt-1">Se o painel persistir aqui, realize o login novamente.</p>
    </div>
  }

}
