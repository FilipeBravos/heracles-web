<div class="p-6 max-w-sm">
  <div class="flex items-center gap-3 text-blue-600 mb-4">
    <mat-icon class="text-3xl !w-8 !h-8">person_add</mat-icon>
    <h2 class="text-xl font-bold text-gray-800">Assumir Aluno</h2>
  </div>

  <div class="mb-6 text-gray-600 text-sm leading-relaxed">
    Você deseja vincular o(a) aluno(a) <strong class="text-gray-900">{{ data.aluno.nome }}</strong> à sua lista de alunos particulares?
    <p class="mt-2 text-xs text-gray-400">A partir disso, você será o Personal responsável por gerenciar as fichas deste membro.</p>
  </div>

  <div class="flex justify-end gap-3">
    <button mat-button class="!rounded-none" (click)="fechar()">
      Cancelar
    </button>
    <button mat-flat-button color="primary" class="!rounded-none" (click)="confirmarVinculo()">
      Confirmar Vínculo
    </button>
  </div>
</div>
