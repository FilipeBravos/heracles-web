<h2 mat-dialog-title class="!text-2xl !font-bold text-gray-800 border-b pb-3 flex items-center gap-2">
  <mat-icon class="text-blue-600">inventory_2</mat-icon> 
  {{ isEdicao() ? 'Editar Ativo Patrimonial' : 'Novo Ativo Patrimonial' }}
</h2>

<mat-dialog-content class="!pt-6 min-w-[400px]">
  <form #formEquipamento="ngForm" class="flex flex-col gap-5">
    
    <div class="grid grid-cols-2 gap-4">
      <div class="flex flex-col gap-1">
        <label class="text-sm font-semibold text-gray-600">Marca *</label>
        <input type="text" [(ngModel)]="novoEquipamento.marca" name="marca" placeholder="Ex: Movement" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required />
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-semibold text-gray-600">Modelo *</label>
        <input type="text" [(ngModel)]="novoEquipamento.modelo" name="modelo" placeholder="Ex: X5" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required />
      </div>
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-sm font-semibold text-gray-600">Quantidade em Estoque/Uso *</label>
      <div class="flex items-center gap-3">
        <input type="number" [(ngModel)]="novoEquipamento.quantidade" name="quantidade" min="1" class="w-1/3 px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 font-bold" required />
        <span class="text-xs text-gray-400">Unidades disponíveis na academia.</span>
      </div>
    </div>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="!pb-4 !pr-6 gap-2 border-t pt-3 mt-4">
  <button mat-button class="!rounded-lg" (click)="fechar()">Cancelar</button>
  <button 
    mat-flat-button 
    color="primary" 
    class="!rounded-lg !px-6" 
    (click)="salvar()"
    [disabled]="!formEquipamento.valid"
  >
    {{ isEdicao() ? 'Salvar Alterações' : 'Cadastrar no Acervo' }}
  </button>
</mat-dialog-actions>
