<h2 mat-dialog-title class="!text-2xl !font-bold text-gray-800 border-b pb-3 flex items-center gap-2">
  <mat-icon class="text-amber-500 font-bold">build</mat-icon> 
  {{ isEdicao() ? 'Editar Registro de Manutenção' : 'Registrar Manutenção' }}
</h2>

<mat-dialog-content class="!pt-6 min-w-[420px]">
  
  <div class="mb-5 bg-amber-50/60 p-3.5 rounded-xl border border-amber-100 flex items-center gap-3">
    <mat-icon class="text-amber-600">construction</mat-icon>
    <div>
      <p class="text-xs font-semibold text-amber-700 uppercase tracking-wider">Equipamento Alvo</p>
      <p class="text-sm font-bold text-gray-800">{{ equipamento.marca }} {{ equipamento.modelo }}</p>
    </div>
  </div>

  <form #formManutencao="ngForm" class="flex flex-col gap-4">
    
    <div class="flex flex-col gap-1">
      <label class="text-sm font-semibold text-gray-600">O que foi feito? *</label>
      <textarea 
        [(ngModel)]="manutencao.descricao" 
        name="descricao" 
        rows="3"
        placeholder="Ex: Troca da lona de corrida e lubrificação do motor."
        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
        required
      ></textarea>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div class="flex flex-col gap-1">
        <label class="text-sm font-semibold text-gray-600">Custo Total (R$) *</label>
        <input 
          type="number" 
          [(ngModel)]="manutencao.valor" 
          name="valor" 
          min="0.01" 
          step="0.01"
          placeholder="0,00"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 font-bold text-red-600"
          required
        />
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-semibold text-gray-600">Data do Reparo *</label>
        <input 
          type="date" 
          [(ngModel)]="manutencao.data" 
          name="data" 
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
          required
        />
      </div>
    </div>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="!pb-4 !pr-6 gap-2 border-t pt-3 mt-4">
  <button mat-button class="!rounded-lg" (click)="fechar()">Cancelar</button>
  <button 
    mat-flat-button 
    color="primary" 
    class="!rounded-lg !px-6" 
    (click)="salvar()"
    [disabled]="!formManutencao.valid"
  >
    Lançar Custos
  </button>
</mat-dialog-actions>
