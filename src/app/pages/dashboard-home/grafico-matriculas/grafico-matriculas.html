<div class="px-5 pb-5">
  @if (mostrandoTabela()) {
    <!-- Mesma série como tabela: é o caminho que não depende de enxergar
         altura nem cor, e o que um leitor de tela percorre de fato. -->
    <table class="w-full text-[12.5px]">
      <caption class="sr-only">{{ resumoAcessivel() }}</caption>
      <thead>
        <tr class="border-b border-linha">
          <th scope="col" class="py-2 text-left font-semibold text-tinta-2">Mês</th>
          <th scope="col" class="py-2 text-right font-semibold text-tinta-2">Matrículas</th>
        </tr>
      </thead>
      <tbody>
        @for (coluna of colunas(); track coluna.ponto.mes) {
          <tr class="border-b border-linha last:border-0">
            <td class="py-1.5 text-tinta">{{ coluna.rotuloCurto }}</td>
            <td class="py-1.5 text-right tabular-nums font-semibold text-tinta">
              {{ coluna.ponto.quantidade }}
            </td>
          </tr>
        }
      </tbody>
    </table>
  } @else {
    <figure class="m-0" role="group" [attr.aria-label]="resumoAcessivel()">
      <div class="flex">
        <!-- Eixo vertical: marcas redondas, alinhadas às linhas de grade. -->
        <div class="relative w-8 shrink-0" [style.height.px]="168" aria-hidden="true">
          @for (marca of marcasDoEixo(); track marca) {
            <span class="absolute right-2 -translate-y-1/2 text-[10.5px] tabular-nums text-tinta-3"
                  [style.top.%]="posicaoDaMarca(marca)">{{ marca }}</span>
          }
        </div>

        <div class="min-w-0 flex-1">
          <!-- Área de plotagem. O padding do topo é a folga onde os
               rótulos diretos cabem sem serem cortados pela barra. -->
          <div class="relative" [style.height.px]="168">
            <!-- Grade: hairline sólida, um passo fora da superfície. -->
            @for (marca of marcasDoEixo(); track marca) {
              <span class="absolute inset-x-0 h-px bg-linha"
                    [style.top.%]="posicaoDaMarca(marca)" aria-hidden="true"></span>
            }

            <div class="absolute inset-0 flex items-end justify-between gap-1 pt-8">
              @for (coluna of colunas(); track coluna.ponto.mes; let i = $index) {
                <!-- A área de acerto é a faixa inteira, não só a barra
                     pintada: mirar num retângulo de 8px de largura não
                     funciona com o mouse nem com o dedo. -->
                <div class="group relative flex h-full flex-1 cursor-default items-end justify-center"
                     tabindex="0" [attr.aria-label]="coluna.descricao"
                     (mouseenter)="ativa.set(i)" (mouseleave)="ativa.set(null)"
                     (focus)="ativa.set(i)" (blur)="ativa.set(null)">

                  @if (coluna.destacada && coluna.ponto.quantidade > 0) {
                    <span class="absolute left-1/2 -translate-x-1/2 text-[11px] font-semibold tabular-nums text-tinta"
                          [style.bottom.%]="coluna.altura" aria-hidden="true">
                      <span class="block pb-1">{{ coluna.ponto.quantidade }}</span>
                    </span>
                  }

                  <!-- Ponta arredondada em cima, quadrada na base: a barra
                       cresce de uma linha de base só. -->
                  <span class="w-full max-w-[24px] rounded-t-[4px] bg-bronze-600 transition-[opacity]"
                        [class.opacity-70]="ativa() !== null && ativa() !== i"
                        [style.height.%]="coluna.altura"
                        [style.min-height.px]="coluna.ponto.quantidade > 0 ? 2 : 0"></span>

                  @if (ativa() === i) {
                    <!-- Uma linha só: em duas, o tooltip da barra mais alta
                         não cabia na folga do topo e cobria o subtítulo. -->
                    <div role="tooltip"
                         class="pointer-events-none absolute bottom-full z-10 mb-1 whitespace-nowrap
                                rounded-marca border border-linha-forte bg-papel px-2.5 py-1
                                shadow-[0_2px_10px_rgba(22,25,29,0.12)]"
                         [class]="ancoragem(i) === 'centro' ? 'left-1/2 -translate-x-1/2'
                                : ancoragem(i) === 'esquerda' ? 'left-0' : 'right-0'">
                      <!-- Valor primeiro: quem está com o ponteiro na barra
                           já sabe de que mês se trata. -->
                      <span class="text-[13px] font-bold tabular-nums text-tinta">
                        {{ coluna.ponto.quantidade }}
                      </span>
                      <span class="ml-1 text-[11.5px] text-tinta-3">
                        {{ coluna.ponto.quantidade === 1 ? 'matrícula' : 'matrículas' }}
                        em {{ coluna.rotuloCurto }}
                      </span>
                    </div>
                  }
                </div>
              }
            </div>
          </div>

          <!-- Eixo horizontal -->
          <div class="mt-2 flex justify-between gap-1" aria-hidden="true">
            @for (coluna of colunas(); track coluna.ponto.mes) {
              <span class="flex-1 text-center text-[10.5px] leading-tight text-tinta-3">
                {{ coluna.rotulo }}
                @if (coluna.ano) {
                  <span class="block text-[9.5px] text-tinta-3/80">{{ coluna.ano }}</span>
                }
              </span>
            }
          </div>
        </div>
      </div>
    </figure>
  }

  <div class="mt-3 flex justify-end">
    <button type="button" (click)="mostrandoTabela.set(!mostrandoTabela())"
            class="text-[12px] font-semibold text-bronze-700 underline underline-offset-2">
      {{ mostrandoTabela() ? 'Ver gráfico' : 'Ver como tabela' }}
    </button>
  </div>
</div>
