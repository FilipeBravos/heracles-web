<div class="p-8">
  <div class="flex justify-between items-center mb-8">
    <div>
      <h1 class="text-3xl font-bold text-gray-800">Treinos</h1>
      <p class="text-gray-500">
        Gerencie as fichas e programas de exercícios da unidade Heracles.
      </p>
    </div>
    <!-- Botão com cantos retos -->
    <button
      mat-flat-button
      color="primary"
      class="rounded-none !py-6"
      (click)="abrirModalNovoTreino()"
    >
      <mat-icon>add</mat-icon> Novo Treino
    </button>
  </div>

  <!-- Container da tabela com ângulos retos -->
  <div
    class="bg-white shadow-sm border border-gray-100 overflow-hidden rounded-none"
  >
    <table mat-table [dataSource]="dataSource()" class="w-full">
      <!-- Coluna ID -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef class="!font-bold text-gray-700">
          ID
        </th>
        <td mat-cell *matCellDef="let treino">#{{treino.id}}</td>
      </ng-container>

      <!-- Coluna Nome do Treino -->
      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef class="!font-bold text-gray-700">
          Nome do Treino
        </th>
        <td mat-cell *matCellDef="let treino" class="font-medium">
          {{treino.nome}}
        </td>
      </ng-container>

      <!-- Coluna Foco -->
      <ng-container matColumnDef="foco">
        <th mat-header-cell *matHeaderCellDef class="!font-bold text-gray-700">
          Foco
        </th>
        <td mat-cell *matCellDef="let treino">{{treino.foco}}</td>
      </ng-container>

      <!-- Coluna Nível -->
      <ng-container matColumnDef="nivel">
        <th mat-header-cell *matHeaderCellDef class="!font-bold text-gray-700">
          Nível
        </th>
        <td mat-cell *matCellDef="let treino">
          <!-- Tag de nível visualmente alinhada -->
          <span
            class="px-3 py-1 text-xs font-bold bg-blue-50 text-blue-700 rounded-none border border-blue-200"
          >
            {{treino.nivel}}
          </span>
        </td>
      </ng-container>

      <!-- Coluna Ações -->
      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let treino" class="text-right">
          <button
            mat-icon-button
            color="accent"
            (click)="abrirModalEditar(treino, $event)"
            title="Editar Ficha"
          >
            <mat-icon>edit</mat-icon>
          </button>

          <button
            mat-icon-button
            color="warn"
            (click)="deletarTreino(treino, $event)"
            title="Excluir Ficha"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns;"
        class="hover:bg-blue-50 cursor-pointer transition-colors"
        (click)="abrirDetalhes(row)"
      ></tr>
    </table>
  </div>
</div>
