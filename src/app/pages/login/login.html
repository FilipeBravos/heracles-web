<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
  <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-2xl shadow-xl border border-gray-100">
    <div class="text-center">
      <h2 class="text-4xl font-extrabold text-blue-600 tracking-tight">Herácles</h2>
      <p class="mt-2 text-sm text-gray-500">Gestão inteligente para sua unidade</p>
    </div>

    <form class="mt-8 space-y-6">
      <div class="space-y-4">
        <!-- Input de Email (Angular Material) -->
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>E-mail</mat-label>
          <input matInput type="email" placeholder="exemplo@heracles.com">
          <mat-icon matSuffix>email</mat-icon>
        </mat-form-field>

        <!-- Input de Senha (Angular Material) -->
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Senha</mat-label>
          <input matInput type="password" placeholder="Sua senha secreta">
          <mat-icon matSuffix>lock</mat-icon>
        </mat-form-field>
      </div>

      <div>
        <button mat-flat-button color="primary" 
                class="w-full !py-6 !text-lg !rounded-xl"
                (click)="entrar()"> <!-- Adicione o (click) -->
        Entrar no Sistema
        </button>
      </div>

      <div class="flex items-center justify-center text-sm">
        <a href="#" class="font-medium text-blue-600 hover:text-blue-500">Esqueceu sua senha?</a>
      </div>
    </form>
  </div>
</div>
