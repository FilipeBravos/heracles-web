<div class="min-h-screen bg-gray-100 flex items-center justify-center">
  <div class="bg-white p-8 shadow-md w-full max-w-md border border-gray-200">
    <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">Heracles</h1>
    
    <form [formGroup]="loginForm" (ngSubmit)="fazerLogin()" class="flex flex-col gap-4">
      
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
        <input type="email" formControlName="email" 
               class="w-full p-2 border border-gray-300 !rounded-none focus:outline-none focus:border-blue-500"
               placeholder="seu@email.com">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
        <input type="password" formControlName="senha" 
               class="w-full p-2 border border-gray-300 !rounded-none focus:outline-none focus:border-blue-500"
               placeholder="******">
      </div>

      @if (erroLogin) {
        <p class="text-red-600 text-sm">Credenciais inválidas. Tente novamente.</p>
      }

      <button type="submit" [disabled]="loginForm.invalid"
              class="w-full bg-blue-600 text-white font-bold py-2 px-4 !rounded-none hover:bg-blue-700 disabled:bg-gray-400 mt-2">
        Entrar
      </button>
    </form>
  </div>
</div>
