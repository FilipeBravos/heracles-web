<div class="p-6">
  <h2 mat-dialog-title class="!p-0 !mb-6 text-2xl font-bold text-gray-800">
    Cadastrar Novo Funcionário
  </h2>

  <mat-dialog-content class="!p-0">
    <form [formGroup]="usuarioForm" class="flex flex-col gap-4 mt-2">
      
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Nome Completo</mat-label>
        <input matInput formControlName="nome" placeholder="Ex: João Silva" />
      </mat-form-field>

      <div class="grid grid-cols-2 gap-4">
        <mat-form-field appearance="outline">
          <mat-label>E-mail (Login)</mat-label>
          <input matInput formControlName="email" type="email" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Senha de Acesso</mat-label>
          <input matInput formControlName="senha" type="password" />
        </mat-form-field>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <mat-form-field appearance="outline">
          <mat-label>CPF</mat-label>
          <input matInput formControlName="cpf" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Telefone</mat-label>
          <input matInput formControlName="telefone" />
        </mat-form-field>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <mat-form-field appearance="outline">
          <mat-label>Cargo / Perfil</mat-label>
          <mat-select formControlName="tipoPerfil">
            <mat-option value="ADMIN">Administrador (Acesso Total)</mat-option>
            <mat-option value="PROFESSOR">Professor / Personal</mat-option>
            <mat-option value="RECEPCAO">Recepção</mat-option>
            <mat-option value="SECRETARIA">Secretaria / Financeiro</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Unidade Base</mat-label>
          <mat-select formControlName="unidadeId">
            <mat-option [value]="1">Heracles Matrix (Musculação)</mat-option>
            <mat-option [value]="2">Heracles Box (Crossfit)</mat-option>
            <mat-option [value]="3">Heracles Studio (Pilates)</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="!p-0 !mt-8">
    <button mat-button mat-dialog-close class="text-gray-500">Cancelar</button>
    <button mat-flat-button color="primary" [disabled]="usuarioForm.invalid" (click)="salvar()">
      Criar Acesso
    </button>
  </mat-dialog-actions>
</div>
