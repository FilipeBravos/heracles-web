<h2 mat-dialog-title class="!text-2xl !font-bold text-gray-800 border-b pb-3 flex items-center gap-2">
  <mat-icon class="text-blue-600">card_membership</mat-icon> 
  {{ isEdicao() ? 'Editar Plano' : 'Criar Novo Plano' }}
</h2>

<mat-dialog-content class="!pt-6 min-w-[420px]">
  <form #formPlano="ngForm" class="flex flex-col gap-4">
    
    <div class="flex flex-col gap-1">
      <label class="text-sm font-semibold text-gray-600">Nome do Pacote *</label>
      <input 
        type="text" 
        [(ngModel)]="novoPlano.nome" 
        name="nome" 
        placeholder="Ex: Plano Semestral VIP"
        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        required
      />
    </div>

    <div class="grid grid-cols-2 gap-4 mt-2">
      
      <div class="flex flex-col gap-1">
        <label class="text-sm font-semibold text-gray-600">Duração (Meses) *</label>
        <div class="relative">
          <mat-icon class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 scale-75">calendar_month</mat-icon>
          <input 
            type="number" 
            [(ngModel)]="novoPlano.duracaoMeses" 
            name="duracao" 
            min="1"
            class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 font-bold"
            required
          />
        </div>
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-semibold text-gray-600">Valor Total (R$) *</label>
        <div class="relative">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 font-bold">R$</span>
          <input 
            type="number" 
            [(ngModel)]="novoPlano.valor" 
            name="valor" 
            min="0.01" 
            step="0.01"
            placeholder="0,00"
            class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 font-bold text-blue-700"
            required
          />
        </div>
      </div>
      
    </div>

    <div class="mt-2 p-3 bg-blue-50 rounded-lg border border-blue-100 flex items-start gap-2">
      <mat-icon class="text-blue-500 scale-75 mt-0.5">info</mat-icon>
      <p class="text-xs text-blue-800 leading-relaxed">
        O valor total será cobrado no momento da matrícula e a validade será calculada automaticamente com base nos meses de duração.
      </p>
    </div>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="!pb-4 !pr-6 gap-2 border-t pt-3 mt-4">
  <button mat-button class="!rounded-lg" (click)="fechar()">Cancelar</button>
  <button 
    mat-flat-button 
    color="primary" 
    class="!rounded-lg !px-6" 
    (click)="salvar()"
    [disabled]="!formPlano.valid"
  >
    {{ isEdicao() ? 'Salvar Alterações' : 'Salvar Pacote' }}
  </button>
</mat-dialog-actions>
