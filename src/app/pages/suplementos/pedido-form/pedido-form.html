<h2 mat-dialog-title class="!text-2xl !font-bold text-gray-800 border-b pb-3 flex items-center gap-2">
  <mat-icon class="text-green-600">shopping_cart_checkout</mat-icon> Finalizar Pedido
</h2>

<mat-dialog-content class="!pt-6 min-w-[380px]">
  
  <div class="mb-6 bg-gray-50 p-4 rounded-2xl border border-gray-100">
    <p class="text-xs font-bold text-gray-400 uppercase tracking-widest">{{ produto.marca }}</p>
    <p class="text-base font-bold text-gray-800">{{ produto.nome }}</p>
    <div class="flex justify-between mt-2 text-sm">
      <span class="text-gray-500">Preço Unitário:</span>
      <span class="font-bold text-gray-700">{{ produto.preco | currency:'BRL' }}</span>
    </div>
  </div>

  <form class="flex flex-col gap-5">
    
    <div class="flex flex-col gap-1">
      <label class="text-sm font-semibold text-gray-600">Nome do Aluno / Professor *</label>
      <input 
        type="text" 
        [ngModel]="nomeComprador()" 
        (ngModelChange)="nomeComprador.set($event)"
        name="comprador" 
        placeholder="Quem está comprando?"
        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-sm font-semibold text-gray-600">Quantidade Desejada *</label>
      <div class="flex items-center gap-4">
        <input 
          type="number" 
          [ngModel]="quantidade()" 
          (ngModelChange)="quantidade.set($event)"
          name="quantidade" 
          min="1"
          [max]="produto.quantidadeEstoque"
          class="w-24 px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 font-bold text-center"
        />
        <span class="text-xs text-gray-400">Máximo disponível: {{ produto.quantidadeEstoque }} un.</span>
      </div>
    </div>

    <div class="mt-4 p-4 bg-green-50 rounded-2xl border border-green-100 flex justify-between items-center">
      <span class="text-green-800 font-bold">Total a Pagar:</span>
      <span class="text-2xl font-black text-green-700">{{ valorTotal() | currency:'BRL' }}</span>
    </div>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="!pb-4 !pr-6 gap-2 border-t pt-3 mt-4">
  <button mat-button class="!rounded-lg" (click)="fechar()">Cancelar</button>
  <button 
    mat-flat-button 
    color="primary" 
    class="!rounded-lg !px-8 !py-5" 
    (click)="confirmarVenda()"
    [disabled]="!nomeComprador() || quantidade() < 1 || quantidade() > produto.quantidadeEstoque"
  >
    Confirmar Compra
  </button>
</mat-dialog-actions>
