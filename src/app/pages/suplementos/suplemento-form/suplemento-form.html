<h2 mat-dialog-title class="!text-2xl !font-bold text-gray-800 border-b pb-3 flex items-center gap-2">
  <mat-icon class="text-blue-600">local_mall</mat-icon> 
  {{ isEdicao() ? 'Editar Suplemento' : 'Cadastrar Suplemento' }}
</h2>

<mat-dialog-content class="!pt-6 min-w-[420px]">
  <form #formSuplemento="ngForm" class="flex flex-col gap-4">
    
    <div class="flex flex-col gap-1">
      <label class="text-sm font-semibold text-gray-600">Nome do Produto *</label>
      <input 
        type="text" 
        [(ngModel)]="novoSuplemento.nome" 
        name="nome" 
        placeholder="Ex: Whey Protein Concentrado 1kg"
        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        required
      />
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-sm font-semibold text-gray-600">Marca *</label>
      <input 
        type="text" 
        [(ngModel)]="novoSuplemento.marca" 
        name="marca" 
        placeholder="Ex: Max Titanium, Growth"
        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        required
      />
    </div>

    <div class="grid grid-cols-2 gap-4 mt-2">
      <div class="flex flex-col gap-1">
        <label class="text-sm font-semibold text-gray-600">Qtd em Estoque *</label>
        <div class="relative">
          <mat-icon class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 scale-75">inventory_2</mat-icon>
          <input 
            type="number" 
            [(ngModel)]="novoSuplemento.quantidadeEstoque" 
            name="quantidade" 
            min="0"
            class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 font-bold"
            required
          />
        </div>
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-semibold text-gray-600">Preço de Venda (R$) *</label>
        <div class="relative">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 font-bold">R$</span>
          <input 
            type="number" 
            [(ngModel)]="novoSuplemento.preco" 
            name="preco" 
            min="0.01" 
            step="0.01"
            placeholder="0,00"
            class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 font-bold text-green-700"
            required
          />
        </div>
      </div>
    </div>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="!pb-4 !pr-6 gap-2 border-t pt-3 mt-4">
  <button mat-button class="!rounded-lg" (click)="fechar()">Cancelar</button>
  <button 
    mat-flat-button 
    color="primary" 
    class="!rounded-lg !px-6" 
    (click)="salvar()"
    [disabled]="!formSuplemento.valid"
  >
    {{ isEdicao() ? 'Salvar Alterações' : 'Cadastrar Produto' }}
  </button>
</mat-dialog-actions>
