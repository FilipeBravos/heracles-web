name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos da aplicacao e dos testes
        # Os specs sao compilados a parte de proposito: foi exatamente aqui
        # que oito arquivos quebrados passaram despercebidos.
        run: |
          npx tsc -p tsconfig.app.json --noEmit
          npx tsc -p tsconfig.spec.json --noEmit

      - name: Build de producao
        run: npm run build

      - name: Testes unitarios
        run: npm run test:ci
